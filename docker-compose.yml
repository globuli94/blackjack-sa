version: '3.8'

services:
  game_service:
    depends_on:
      - kafka
      - persistence_service
    build:
      context: ./s_gameService
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  tui_service:
    depends_on:
      - kafka
    build:
      context: ./s_tuiService
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true

  persistence_service:
    depends_on:
      - kafka
    build:
      context: ./s_persistenceService
      dockerfile: Dockerfile
    ports:
      - "8082:8082"

  postgres_service:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blackjack
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  kafka_zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka_zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: kafka_zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

volumes:
  pg_data:


